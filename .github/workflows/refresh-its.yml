name: Refresh official ITS address source

on:
  schedule:
    - cron: "17,47 * * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: official-its-address-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: windows-latest
    timeout-minutes: 8
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Refresh official ITS address metadata
        run: node scripts/refresh-its.mjs

      - name: Validate output
        shell: pwsh
        run: |
          $j = Get-Content 'out/its-addresses.json' -Raw | ConvertFrom-Json
          $count = $j.entries.PSObject.Properties.Count
          $age = [DateTimeOffset]::UtcNow.ToUnixTimeMilliseconds() - [int64]$j.at
          if ($count -lt 10000 -or $count -gt 15000 -or $age -lt 0 -or $age -gt 600000) { throw "ITS_OUTPUT_INVALID count=$count age=$age" }
          Write-Output "count=$count at=$($j.at)"

      - name: Publish latest-only data branch
        shell: bash
        run: |
          set -euo pipefail
          tmp="$(mktemp -d)"
          cp -R out/. "$tmp/"
          git config user.name "HealingMart ITS Bot"
          git config user.email "actions@users.noreply.github.com"
          git checkout --orphan data
          git rm -rf . >/dev/null 2>&1 || true
          find . -mindepth 1 -maxdepth 1 -not -name .git -exec rm -rf {} +
          cp -R "$tmp"/. .
          git add its-addresses.json health.json buckets
          git commit -m "data: refresh official ITS addresses"
          git push --force origin HEAD:data
